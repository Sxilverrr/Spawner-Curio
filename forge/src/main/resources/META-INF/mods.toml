modLoader = "javafml"
loaderVersion = "${forge_range}"
license = "MIT"
issueTrackerURL = "https://github.com/Sxilverrr/Spawner-Curio/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "Sxilverr"
description = "A Curios necklace that speeds up nearby spawners."
logoFile = "icon.png"

[[dependencies.${id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${id}]]
    modId = "curios"
    mandatory = true
    versionRange = "*"
    ordering = "AFTER"
    side = "BOTH"
